services:
  backend:
    build: ./backend
    container_name: pos-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: .
    container_name: pos-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped